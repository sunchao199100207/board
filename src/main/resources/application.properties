# --- 服务名 ---
spring.application.name=board
# --- 设置应用的上下文路径 ---
server.servlet.context-path=/board
# 服务器端口 (您之前提到过 8089, 我这里也改成 8089)
server.port=8089

# --- Redis 配置 ---
# 替换 localhost 为您的 Redis 服务器地址
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=


# 玩家加入房间后，未选座的超时踢出时间 (毫秒)
app.game.afk.seat-select-timeout-ms=20000

# Redis 启动时是否清理游戏数据 (true=清理, false=不清理)
# 建议开发/测试环境设为 true，生产环境设为 false
app.redis.cleanup-on-startup=true

# 健康检查：http://主机:8089/board/health
# 只暴露 health，并且不要占用网站根路径
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never

