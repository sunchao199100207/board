<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双身份狼人杀 - 多开</title>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; background: #1b2140; color: #fff; }
        header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 16px; }
        input { width: 88px; padding: 8px; border-radius: 8px; border: none; }
        #hint { padding: 0 16px; color: #c9d0ea; }
        button { padding: 8px 14px; border: none; border-radius: 8px; background: #6d7cff; color: #fff; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; padding: 0 16px 24px; }
        iframe { width: 100%; height: 640px; border: 0; border-radius: 16px; background: #fff; }
        .cell { background: #111628; border-radius: 16px; padding: 8px; }
        .label { font-size: 13px; margin-bottom: 6px; }
    </style>
</head>
<body>
<header>
    <strong>双身份发牌多开</strong>
    <label>房间 <input id="room" value="6666"></label>
    <label>玩家 <input id="count" type="number" min="6" max="8" value="6"></label>
    <button id="btn-run">开一局 6 人</button>
    <button id="btn-deal">法官发牌</button>
    <button id="btn-choose">玩家确认上身份</button>
</header>
<p id="hint">6 到 8 人。开局按这个人数配牌并打开对应窗口。第 1 个是法官，其余自动入座并准备。发牌后点确认，每人默认把第一张当作上身份。</p>
<div id="grid" class="grid"></div>
<script>
    var countInput = document.getElementById('count');
    countInput.oninput = function () {
        document.getElementById('btn-run').textContent = '开一局 ' + (countInput.value || '?') + ' 人';
    };
    document.getElementById('btn-run').onclick = function () {
        var room = document.getElementById('room').value.trim() || '6666';
        var count = readCount();
        document.getElementById('btn-run').textContent = '开一局 ' + count + ' 人';
        document.getElementById('hint').textContent =
            '本局 ' + count + ' 人。第 1 个窗口是法官，其余 ' + count + ' 个窗口自动入座并准备。';
        var grid = document.getElementById('grid');
        grid.innerHTML = '';
        grid.appendChild(wrap('法官', frame(room, 'judge', 0, count, 200)));
        for (var i = 1; i <= count; i++) {
            grid.appendChild(wrap(i + ' 号', frame(room, 'player', i, count, 400 + i * 250)));
        }
    };
    function readCount() {
        var count = parseInt(countInput.value, 10);
        if (!count || count < 6) {
            count = 6;
        }
        if (count > 8) {
            count = 8;
        }
        countInput.value = String(count);
        return count;
    }
    document.getElementById('btn-deal').onclick = function () {
        var host = document.querySelector('iframe[data-role="judge"]');
        if (!host || !host.contentWindow) {
            alert('先开一局');
            return;
        }
        host.contentWindow.postMessage({ type: 'DUAL_DEAL' }, window.location.origin);
    };
    document.getElementById('btn-choose').onclick = function () {
        var frames = document.querySelectorAll('iframe[data-role="player"]');
        if (!frames.length) {
            alert('先开一局');
            return;
        }
        frames.forEach(function (frame) {
            frame.contentWindow.postMessage({ type: 'DUAL_CHOOSE' }, window.location.origin);
        });
    };
    function frame(room, role, seat, players, delayMs) {
        var iframe = document.createElement('iframe');
        var query = new URLSearchParams({
            nostorage: '1',
            auto: '1',
            role: role,
            room: room,
            players: String(players),
            delayMs: String(delayMs)
        });
        if (seat) {
            query.set('seat', String(seat));
        }
        query.set('pid', rememberedId(room, role, seat));
        iframe.src = 'dual-deal.html?' + query.toString();
        iframe.dataset.role = role;
        return iframe;
    }
    function rememberedId(room, role, seat) {
        var key = 'dualSeat:' + room + ':' + role + ':' + (seat || 0);
        var id = localStorage.getItem(key);
        if (!id) {
            id = (window.crypto && crypto.randomUUID)
                ? crypto.randomUUID()
                : 'dual-' + Math.random().toString(16).slice(2) + Date.now().toString(16);
            localStorage.setItem(key, id);
        }
        return id;
    }
    function wrap(label, iframe) {
        var cell = document.createElement('div');
        cell.className = 'cell';
        var title = document.createElement('div');
        title.className = 'label';
        title.textContent = label;
        cell.appendChild(title);
        cell.appendChild(iframe);
        return cell;
    }
</script>
</body>
</html>
