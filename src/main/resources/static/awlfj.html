<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <!-- 禁用缓存，防止微信浏览器缓存导致更新不生效 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>阿瓦隆游戏大厅</title>
    <link rel="stylesheet" href="css/awlfj.css?v=20250117">
    <script>
        (function(){
            try {
                var params = new URLSearchParams(window.location.search);
                if (params.get('nostorage') === '1') {
                    var mem = {};
                    var shim = {
                        getItem: function(k){ return Object.prototype.hasOwnProperty.call(mem,k) ? mem[k] : null; },
                        setItem: function(k,v){ mem[k] = String(v); },
                        removeItem: function(k){ delete mem[k]; },
                        clear: function(){ mem = {}; },
                        key: function(i){ return Object.keys(mem)[i] || null; },
                        get length(){ return Object.keys(mem).length; }
                    };
                    Object.defineProperty(window, 'localStorage', { value: shim });
                }
            } catch(e) {
                // ignore
            }
        })();
    </script>
</head>
<body>

<div class="container">

    <div id="page-home" class="page active">
        <div class="card">
            <h1>阿瓦隆</h1>
            <div id="home-error" class="error-message"></div>

            <p>
                <label for="room-number">房间号:</label>
                <input id="room-number" type="text" inputmode="numeric" placeholder="输入 4-6 位数字房间号">
            </p>

            <div id="player-slider-container">
                <label for="total-players">总人数: <span id="total-players-value">10</span></label>
                <input type="range" id="total-players" min="5" max="12" value="10">
            </div>

            <div class="action-buttons">
                <button id="btn-join-room" class="btn btn-secondary">加入房间</button>
                <button id="btn-create-room" class="btn btn-primary">创建房间</button>
            </div>
        </div>
    </div>

    <div id="page-room" class="page">
        <div class="card">
            <h2>房间号: <span id="room-info-number"></span></h2>
            <div id="room-error" class="error-message"></div>

            <p class="prompt-box">请选择你的座位，然后点击准备</p>

            <div id="seat-selection-grid" class="seat-grid">
            </div>

            <p class="prompt-box" id="room-status-text">等待玩家加入...</p>

            <div class="action-buttons">
                <button id="btn-leave-room" class="btn btn-danger">离开房间</button>
                <button id="btn-ready" class="btn btn-primary" disabled>准备</button>
            </div>
            
            <div id="player-config-info" class="player-config-info">
                <div id="config-identities" class="config-identities"></div>
                <div id="config-visibility" class="config-visibility"></div>
            </div>
        </div>
    </div>

    <div id="page-identity" class="page">
        <div class="card">
            <h2>你的身份是</h2>
            <div class="card" id="identity-card">
                <img id="identity-image" src="" alt="角色图片" />
                <div id="identity-name"></div>
            </div>

            <div class="prompt-box seen-info" id="seen-info">
                <span id="seen-title"></span>
                <span id="seen-players"></span>
                <span id="seen-subtitle"></span>
                <span class="leader-tag">领袖: <span id="leader-seat-number"></span> 号</span>
            </div>

            <div id="mission-history" class="prompt-box" style="margin-top: 10px; font-size: 14px;">
                <div style="font-weight: bold; margin-bottom: 5px;">任务历史：</div>
                <div id="mission-history-content" style="line-height: 1.6;"></div>
            </div>

            <div id="lake-lady-section" class="lake-lady" style="display: none;">
                <div class="lake-lady-header" id="lake-lady-header">
                    <span class="lake-lady-icon">🌊</span>
                    <span class="lake-lady-title">湖中仙女</span>
                    <span class="lake-lady-subtitle" id="lake-lady-subtitle">选择查验玩家</span>
                </div>
                <div id="lake-lady-inspect-section" class="lake-lady-inspect" style="display: none;">
                    <div id="lake-lady-seat-grid" class="lake-lady-seat-grid"></div>
                </div>
                <div id="lake-lady-result-section" class="lake-lady-result" style="display: none;">
                    <div class="lake-lady-result-row">
                        <span id="lake-lady-inspect-result" class="lake-lady-inspect-result"></span>
                    </div>
                </div>
            </div>

            <div id="identity-error" class="error-message"></div>

            <div class="action-buttons">
                <button id="btn-start-mission" class="btn btn-primary">上车做任务</button>
                <button id="btn-return-to-room" class="btn btn-secondary">返回房间 (下一局)</button>
            </div>
        </div>
    </div>

    <div id="page-mission" class="page">
        <div class="card">
            <h2>第 <span id="mission-round-number"></span> 轮任务</h2>
            <div class="prompt-box">
                当前领袖: <span id="mission-leader-seat"></span> 号
            </div>
            <div class="prompt-box">
                需要选择 <span id="mission-required-size"></span> 名玩家上车
            </div>
            <div id="mission-error" class="error-message"></div>

            <div id="mission-seat-grid" class="seat-grid">
            </div>

            <div class="action-buttons">
                <button id="btn-cancel-mission" class="btn btn-secondary">返回</button>
            </div>
        </div>
    </div>

    <div id="page-voting" class="page">
        <div class="card">
            <h2>任务投票</h2>
            <div class="prompt-box">
                第 <span id="voting-round-number"></span> 轮任务
            </div>
            <div class="prompt-box">
                任务成员: <span id="voting-members"></span>
            </div>
            <div id="voting-error" class="error-message"></div>

            <div class="prompt-box">
                请选择任务结果
            </div>

            <div class="action-buttons" style="flex-direction: column; gap: 10px;">
                <button id="btn-vote-success" class="btn btn-primary" style="width: 100%;">任务成功</button>
                <button id="btn-vote-fail" class="btn btn-danger" style="width: 100%;">任务失败</button>
                <button id="btn-back-to-identity-from-voting" class="btn btn-secondary" style="width: 100%;">返回身份</button>
            </div>

            <div class="prompt-box" id="voting-status">
                等待其他玩家投票...
            </div>
        </div>
    </div>

    <div id="page-mission-result" class="page">
        <div class="card">
            <h2>任务结果</h2>
            <div class="prompt-box">
                第 <span id="result-round-number"></span> 轮任务
            </div>
            <div id="mission-result-display" class="prompt-box" style="font-size: 24px; font-weight: bold; margin: 20px 0;">
            </div>
            <div class="action-buttons">
                <button id="btn-back-to-identity" class="btn btn-primary">返回身份牌</button>
            </div>
        </div>
    </div>

</div>

<div id="loader-overlay" class="loader-overlay">
    <div class="loader-content">
        <div class="loader-spinner"></div>
        <div id="loader-text" class="loader-text">加载中...</div>
    </div>
</div>

<!-- 断线遮盖层 -->
<div id="reconnect-overlay" class="reconnect-overlay" style="display: none;">
    <div class="reconnect-content">
        <div class="reconnect-icon">🔌</div>
        <div class="reconnect-title">连接已断开</div>
        <div class="reconnect-message">请重新连接以继续游戏</div>
        <button id="btn-reconnect" class="reconnect-btn-large" title="重新连接">
            🔄 重新连接
        </button>
    </div>
</div>

<!-- 调试控制台按钮 -->
<button id="btn-debug-console" class="debug-console-btn" title="打开调试控制台">🐛</button>

<!-- 调试控制台面板 -->
<div id="debug-console-overlay" class="debug-console-overlay" style="display: none;">
    <div class="debug-console-content">
        <div class="debug-console-header">
            <span class="debug-console-title">调试控制台</span>
            <button id="btn-close-console" class="debug-console-close">✕</button>
        </div>
        <div class="debug-console-toolbar">
            <button id="btn-clear-console" class="debug-console-btn-small">清空</button>
            <button id="btn-copy-console" class="debug-console-btn-small">复制</button>
            <label class="debug-console-filter">
                <input type="checkbox" id="console-filter-log" checked> Log
            </label>
            <label class="debug-console-filter">
                <input type="checkbox" id="console-filter-warn" checked> Warn
            </label>
            <label class="debug-console-filter">
                <input type="checkbox" id="console-filter-error" checked> Error
            </label>
        </div>
        <div id="debug-console-output" class="debug-console-output"></div>
    </div>
</div>

<script src="js/socket/sockjs.min.js"></script>
<script src="js/socket/stomp.min.js"></script>
<script src="js/awlfj.js?v=20250117"></script>
<script src="js/awlfj.auto.js?v=20250117"></script>
</body>
</html>
