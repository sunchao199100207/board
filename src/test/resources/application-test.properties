# 测试环境配置
spring.application.name=board-test

# 服务器配置
server.servlet.context-path=/board
server.port=0  # 随机端口，由测试框架分配

# Redis 配置（测试环境可以使用内嵌Redis或者真实Redis）
# 如果使用内嵌Redis，需要添加依赖
spring.redis.host=localhost
spring.redis.port=6379
# 如果Redis有密码，取消注释下面的行
# spring.redis.password=

# 玩家加入房间后，未选座的超时踢出时间 (毫秒) - 测试时设置较长时间
app.game.afk.seat-select-timeout-ms=60000


